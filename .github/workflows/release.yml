name: Validate and release
on:
  push:
    branches: [main]
    paths: [system.json, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fdern-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        with:
          name: fdern-ui-checks
          path: artifacts/ui/
      - run: npm run build:packs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: fdern-package
          path: dist/
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('system.json')).version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 1; fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq '.object.sha')
            # One-time finalization of the first release created in this implementation session.
            # All subsequent release versions remain immutable.
            if [[ "$VERSION" == "0.1.0" && "$EXISTING" == "b253f6a8da20911d168f6dee29de613bfdb6c2bf" ]]; then
              gh release upload "v$VERSION" dist/fdern.zip dist/system.json dist/SHA256SUMS --clobber
              gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/v$VERSION" -X PATCH -f sha="$GITHUB_SHA" -F force=true
              gh release edit "v$VERSION" --notes-file docs/RELEASE-NOTES.md
              exit 0
            fi
            echo "This version already exists; releases are immutable. Bump system.json and package.json for the next release."
            exit 0
          fi
          gh release create "v$VERSION" dist/fdern.zip dist/system.json dist/SHA256SUMS --target "$GITHUB_SHA" --title "FDERN v$VERSION" --notes-file docs/RELEASE-NOTES.md
