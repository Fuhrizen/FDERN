name: Validate and release
on:
  push:
    branches: [main]
    paths: [system.json, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fdern-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm run test:ui
        env:
          FDERN_CHROMIUM: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: fdern-ui-checks
          path: artifacts/ui/
      - run: npm run build:packs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: fdern-package
          path: dist/
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('system.json')).version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 1; fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "This version already exists; releases are immutable. Bump system.json and package.json for the next release."
            exit 0
          fi
          gh release create "v$VERSION" dist/fdern.zip dist/system.json dist/SHA256SUMS --target "$GITHUB_SHA" --title "FDERN v$VERSION" --notes-file docs/RELEASE-NOTES.md
